services:
  db:
    image: postgres:17-alpine
    ports:
      # Published on 5433 to avoid clashing with a Postgres already running on
      # the host's default 5432. In-container traffic still uses 5432 (see the
      # http service's POSTGRES_PORT below).
      - "5433:5432"
    environment:
      POSTGRES_USER: location_tracker
      POSTGRES_PASSWORD: location_tracker
      POSTGRES_DB: location_tracker
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U location_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  http:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bun run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/home/bun/app
      - /home/bun/app/node_modules
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: location_tracker
      POSTGRES_PASSWORD: location_tracker
      POSTGRES_DB: location_tracker
      PORT: "3000"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bun run dev:app
    ports:
      - "3002:3002"
    volumes:
      - .:/home/bun/app
      - /home/bun/app/node_modules
    environment:
      APP_PORT: "3002"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      - http

volumes:
  pg_data:
  redis_data:
  prometheus_data:
